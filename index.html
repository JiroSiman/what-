<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hi Crush</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #ffe6f0;
            overflow: hidden;
            position: relative;
        }

        .container {
            position: relative;
            z-index: 1000;
            text-align: center;
            top: 50%;
            transform: translateY(-50%);
        }

        .buttons {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        button {
            padding: 10px 25px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .yes {
            background-color: #ff4d88;
            color: white;
        }

        .no {
            background-color: #ccc;
            position: absolute;
            z-index: 9999; 
        }

        .meme {
            position: absolute;
            width: 120px;
            background: white;
            padding: 6px;
            border-radius: 12px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
            z-index: 10;
        }

        .meme img {
            width: 100%;
            border-radius: 8px;
        }

        .arrow-gif {
            position: absolute;
            width: 60px;
            background: none;
            box-shadow: none;
            padding: 0;
            z-index: 900;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            .meme {
                width: 70px;
            }

            .arrow-gif {
                width: 40px;
            }
        }
    </style>
</head>

<body>

<div class="container" id="mainContainer">
    <h1>HI CRUSH 💖</h1>
    <h3>I like you a lot, wanna go on a date?</h3>

    <div class="buttons">
        <button class="yes" id="yesBtn">YES 😍</button>
        <button class="no" id="noBtn">NO 😭</button>
    </div>
</div>

<audio id="yesSound" src="sound.mp3"></audio>

<script>
    const memes = ["1.jpg","2.jpg","4.jpg","5.jpg","6.jpg","33.jpg"];
    let remainingMemes = [...memes];
    let noClicks = 0;
    let arrowShown = false;

    const arrowGifURL = "https://media.tenor.com/yso9Ncqwm5UAAAAi/click-subscribe.gif";

    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const main = document.getElementById("mainContainer");

    yesBtn.addEventListener("click", () => {
        const audio = document.getElementById("yesSound");
        audio.currentTime = 0;
        audio.play().catch(()=>{});
        setTimeout(() => {
            window.location.href = "yes.html";
        }, 300);
    });

    noBtn.addEventListener("click", () => {
        noClicks++;

        if (noClicks === 2 && !arrowShown) {
            showArrow();
            arrowShown = true;
        }

        spawnMeme();
        moveNoButton();
    });

    function spawnMeme() {
        if (remainingMemes.length === 0) {
            remainingMemes = [...memes];
            return;
        }

        const meme = document.createElement("div");
        meme.className = "meme";

        const img = document.createElement("img");
        const index = Math.floor(Math.random() * remainingMemes.length);
        img.src = remainingMemes.splice(index,1)[0];
        meme.appendChild(img);

        const mainRect = main.getBoundingClientRect();
        let x,y;

        do {
            x = Math.random() * (window.innerWidth - 150);
            y = Math.random() * (window.innerHeight - 150);
        } while (
            x < mainRect.right &&
            x + 120 > mainRect.left &&
            y < mainRect.bottom &&
            y + 120 > mainRect.top
        );

        meme.style.left = x + "px";
        meme.style.top = y + "px";

        document.body.appendChild(meme);
    }

    function showArrow() {
        const arrow = document.createElement("img");
        arrow.src = arrowGifURL;
        arrow.className = "arrow-gif";

        const yesRect = yesBtn.getBoundingClientRect();
        arrow.style.left = (yesRect.left + yesRect.width/2 - 30) + "px";
        arrow.style.top = (yesRect.bottom + 5) + "px";

        document.body.appendChild(arrow);
    }

    function moveNoButton() {
        const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
        const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
    }
</script>

</body>
</html>
