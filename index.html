<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hello Crush</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #ffe6f0;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }

  h1 {
    font-size: clamp(1.5rem, 5vw, 3rem);
  }

  .btns {
    margin-top: 20px;
    position: relative;
  }

  button {
    padding: 12px 25px;
    font-size: 1.2rem;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }

  .yes {
    background: hotpink;
    color: white;
    margin-right: 10px;
    z-index: 10;
    position: relative;
  }

  .no {
    background: gray;
    color: white;
    position: absolute;
  }
  .arrow {
    position: fixed;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    pointer-events: none;
    z-index: 1;
  }
</style>
</head>

<body>

<h1>Hello Crush!!! 💖</h1>

<div class="btns">
  <button class="yes" onclick="yesClick()">YES</button>
  <button class="no" onclick="noClick()">NO</button>
</div>
    
<audio id="sound" preload="auto">
  <source src="canton.mp3" type="audio/mpeg">
</audio>

<img src="https://media.tenor.com/yso9Ncqwm5UAAAAi/click-subscribe.gif" class="arrow">

<script>
let noClicks = 0;

function yesClick() {
  const audio = document.getElementById("sound");
  audio.currentTime = 0;
  audio.play(); 

  alert("Yay! 💕");
}

function noClick() {
  noClicks++;

  const noBtn = document.querySelector(".no");

  const maxX = window.innerWidth - noBtn.offsetWidth;
  const maxY = window.innerHeight - noBtn.offsetHeight;

  const x = Math.random() * maxX;
  const y = Math.random() * maxY;

  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}
</script>

</body>
</html>
