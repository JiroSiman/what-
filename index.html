<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<title>Hi Crush</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100svh; 
    background-color: #ffe6f0;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.container {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    pointer-events: none;
}

.container * {
    pointer-events: auto;
}

.buttons {
    display: flex;
    gap: 20px;
    margin-top: 20px;
}

button {
    padding: 10px 22px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
}

.yes {
    background: #ff4d88;
    color: white;
}

.no {
    background: #ccc;
    position: fixed;
    z-index: 9999;
}

.meme {
    position: fixed;
    width: 90px; 
    background: white;
    padding: 6px;
    border-radius: 10px;
    box-shadow: 0 6px 12px rgba(0,0,0,0.2);
    z-index: 10;
}

.meme img {
    width: 100%;
    border-radius: 8px;
}

.arrow-gif {
    position: fixed;
    width: 45px;
    pointer-events: none;
    z-index: 900;
}

@media (min-width: 768px) {
    .meme {
        width: 130px;
    }
    .arrow-gif {
        width: 60px;
    }
}
</style>
</head>

<body>

<div class="container" id="safeZone">
    <h1>HI CRUSH 💖</h1>
    <h3>I like you a lot, wanna go on a date?</h3>

    <div class="buttons">
        <button class="yes" id="yesBtn">YES 😍</button>
        <button class="no" id="noBtn">NO 😭</button>
    </div>
</div>

<audio id="yesSound" src="sound.mp3"></audio>

<script>
const memes = ["1.jpg","2.jpg","4.jpg","5.jpg","6.jpg","33.jpg"];
let pool = [...memes];
let noClicks = 0;
let arrowShown = false;

const arrowURL = "https://media.tenor.com/yso9Ncqwm5UAAAAi/click-subscribe.gif";

const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const safe = document.getElementById("safeZone");

yesBtn.addEventListener("click", () => {
    const s = document.getElementById("yesSound");
    s.currentTime = 0;
    s.play().catch(()=>{});
    setTimeout(()=>location.href="yes.html",300);
});

noBtn.addEventListener("click", () => {
    noClicks++;

    if (noClicks === 2 && !arrowShown) {
        showArrow();
        arrowShown = true;
    }

    spawnMeme();
    moveNo();
});

function spawnMeme() {
    if (pool.length === 0) pool = [...memes];

    const img = document.createElement("img");
    img.src = pool.splice(Math.floor(Math.random()*pool.length),1)[0];

    const meme = document.createElement("div");
    meme.className = "meme";
    meme.appendChild(img);

    const safeRect = safe.getBoundingClientRect();

    let x,y;
    do {
        x = Math.random() * (window.innerWidth - 100);
        y = Math.random() * (window.innerHeight - 120);
    } while (
        x < safeRect.right &&
        x + 90 > safeRect.left &&
        y < safeRect.bottom &&
        y + 90 > safeRect.top
    );

    meme.style.left = x+"px";
    meme.style.top = y+"px";
    document.body.appendChild(meme);
}

function showArrow() {
    const arrow = document.createElement("img");
    arrow.src = arrowURL;
    arrow.className = "arrow-gif";

    const r = yesBtn.getBoundingClientRect();
    arrow.style.left = r.left + r.width/2 - 22 + "px";
    arrow.style.top = r.bottom + 6 + "px";

    document.body.appendChild(arrow);
}

function moveNo() {
    const x = Math.random()*(window.innerWidth - noBtn.offsetWidth);
    const y = Math.random()*(window.innerHeight - noBtn.offsetHeight);
    noBtn.style.left = x+"px";
    noBtn.style.top = y+"px";
}
</script>

</body>
</html>
