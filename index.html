<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hi Crush</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #ffe6f0;
            position: relative;
            overflow: hidden;
        }

        .container {
            text-align: center;
            z-index: 1000; 
        }

        .buttons {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        button {
            padding: 10px 25px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        .yes {
            background-color: #ff4d88;
            color: white;
        }

        .no {
            background-color: #ccc;
            z-index: 9999; 
        }

        .meme {
            position: absolute;
            width: 140px; 
            background: transparent; 
            padding: 0; 
            z-index: 10;
            animation: float 3s ease-in-out infinite;
        }

        .meme img {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .arrowGif {
            width: 100px;  
            height: auto;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
       
        @media (max-width: 600px) {
            .meme {
                width: 120px; 
            }
            .arrowGif {
                width: 80px;
            }
            .buttons {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }
            button {
                width: 150px;
            }
        }
        
        h1 {
            color: #ff4d88;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        h3 {
            color: #666;
            font-size: 1.2em;
        }
    </style>
</head>

<body>

    <div class="container" id="mainContainer">
        <h1>HI CRUSH 💖</h1>
        <h3>I like you a lot, wanna go on a date?</h3>

        <div class="buttons">
            <a href="yes.html" id="yesLink">
                <button class="yes" id="yesBtn" onclick="goYes()">YES 😍</button>
            </a>

            <button class="no" id="noBtn" onclick="noClick()">NO 😭</button>
        </div>
    </div>

    <script>
        let noClicks = 0;
        let isYesClicked = false;

        function goYes() {
            if (isYesClicked) return;
            isYesClicked = true;
            
            // Optional: Add click animation
            const yesBtn = document.getElementById('yesBtn');
            yesBtn.style.transform = 'scale(0.95)';
            yesBtn.style.opacity = '0.8';
            
            // Redirect to yes.html - DOON MAG-PLAY ANG SOUND
            setTimeout(() => {
                window.location.href = "yes.html";
            }, 200);
        }

        const memes = [
            "1.jpg",
            "2.jpg",
            "4.jpg",
            "5.jpg",
            "6.jpg",
            "33.jpg"
        ];

        const memeGifs = [
            "https://media.tenor.com/yso9Ncqwm5UAAAAi/click-subscribe.gif"
        ];

        let availableMemes = [...memes];

        function noClick() {
            noClicks++;

            const meme = document.createElement("div");
            meme.classList.add("meme");

            const main = document.getElementById("mainContainer");
            const mainRect = main.getBoundingClientRect();

            
            if (noClicks === 2) {
                const gif = document.createElement("img");
                gif.src = memeGifs[0];
                gif.classList.add("arrowGif");
                meme.appendChild(gif);

               
                const yesBtn = document.getElementById("yesBtn");
                const yesPos = yesBtn.getBoundingClientRect();

                const x = yesPos.left + (yesPos.width / 2) - 50;
                const y = yesPos.bottom + 10;

                meme.style.left = x + "px";
                meme.style.top = y + "px";

            } else {
                if (availableMemes.length === 0) {
                    // Reset memes if all have been shown
                    availableMemes = [...memes];
                }

                const randomIndex = Math.floor(Math.random() * availableMemes.length);
                const chosen = availableMemes[randomIndex];
                availableMemes.splice(randomIndex, 1);

                const img = document.createElement("img");
                img.src = chosen;
                meme.appendChild(img);

                let x, y;
                do {
                    x = Math.random() * (window.innerWidth - 200);
                    y = Math.random() * (window.innerHeight - 200);
                } while (
                    x < mainRect.right &&
                    x + 180 > mainRect.left &&
                    y < mainRect.bottom &&
                    y + 150 > mainRect.top
                );

                meme.style.left = x + "px";
                meme.style.top = y + "px";
            }

            document.body.appendChild(meme);

            // Make NO button run away
            const btn = document.getElementById("noBtn");
            
            // Calculate new position that's not under memes
            let nx, ny, isValidPosition;
            let attempts = 0;
            
            do {
                nx = Math.random() * (window.innerWidth - btn.offsetWidth);
                ny = Math.random() * (window.innerHeight - btn.offsetHeight);
                
                // Check if new position overlaps with main container
                isValidPosition = !(
                    nx < mainRect.right &&
                    nx + btn.offsetWidth > mainRect.left &&
                    ny < mainRect.bottom &&
                    ny + btn.offsetHeight > mainRect.top
                );
                
                attempts++;
            } while (!isValidPosition && attempts < 20);

            btn.style.position = "absolute";
            btn.style.left = nx + "px";
            btn.style.top = ny + "px";
            btn.style.zIndex = 9999;
            
            // Add bounce animation
            btn.style.transition = "left 0.3s, top 0.3s";
            
            // Make button smaller after many clicks (as a joke)
            if (noClicks > 5) {
                const scale = Math.max(0.5, 1 - (noClicks * 0.05));
                btn.style.transform = `scale(${scale})`;
            }
        }
        
        // Prevent right-click on images (optional)
        document.addEventListener('contextmenu', function(e) {
            if (e.target.tagName === 'IMG') {
                e.preventDefault();
            }
        });
        
        // Add some hearts animation in background (optional)
        function createFloatingHearts() {
            if (document.querySelector('.heart')) return;
            
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.innerHTML = '💖';
                    heart.style.position = 'absolute';
                    heart.style.fontSize = Math.random() * 20 + 20 + 'px';
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.top = '100vh';
                    heart.style.opacity = '0.3';
                    heart.style.zIndex = '1';
                    heart.style.pointerEvents = 'none';
                    heart.classList.add('heart');
                    
                    document.body.appendChild(heart);
                    
                    // Animate heart floating up
                    const duration = Math.random() * 3000 + 4000;
                    const keyframes = [
                        { transform: 'translateY(0) rotate(0deg)', opacity: 0.3 },
                        { transform: `translateY(-${window.innerHeight + 100}px) rotate(${Math.random() * 360}deg)`, opacity: 0 }
                    ];
                    
                    heart.animate(keyframes, {
                        duration: duration,
                        easing: 'cubic-bezier(0.2, 0, 0.8, 1)'
                    });
                    
                    // Remove heart after animation
                    setTimeout(() => {
                        if (heart.parentNode) {
                            heart.parentNode.removeChild(heart);
                        }
                    }, duration);
                }, i * 800);
            }
        }
        
        // Start floating hearts
        setInterval(createFloatingHearts, 5000);
        createFloatingHearts(); // Initial hearts
    </script>

</body>
</html>
