<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YES 💖</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffe6f0, #ffd6b8);
            font-family: 'Arial', sans-serif;
        }

        .card {
            width: 90%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 25px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            padding: 30px;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 38px;
            color: #ff4d88;
        }

        h2 {
            margin: 10px 0 20px 0;
            font-size: 20px;
            color: #555;
        }

        .gifs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }

        .gifs img {
            width: 150px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            animation: pop 0.6s ease;
        }

        @keyframes pop {
            from {
                transform: scale(0.5);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        h3 {
            margin: 25px 0 0 0;
            color: #ff4d88;
            font-weight: bold;
        }

        #autoPlayTrigger {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>💖 YAY! 💖</h1>
        <h2>Date confirmed 😎</h2>

        <div class="gifs">
            <img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExMjZyMTl5c2JyeTU0aTNuNGdvN2xvN2gwNzBkemxtd282YjlwdWN0NiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/Rik9n81Vda3rzr5F8h/giphy.gif" alt="cute">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExejdjMmMyNmhiMjlmODd0eWo3NGM4NTZnbmV3czIxbzA3YjVndDQ0cSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/oF5oUYTOhvFnO/giphy.gif" alt="cute">
             <img src="https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3NzZid3J2dmthcGI3YnQ3emo2ZzlxZTdtYTEzaXNoOHQwcHQ3cjEwayZlcD12MV9naWZzX3NlYXJjaCZjdD1n/d37mEpcaGP3pudPoho/giphy.gif" alt="cute">
        </div> 

        <audio id="sound">
            <source src="canton.mp3" type="audio/mpeg">
            Your browser does not support audio.
        </audio>
        
       
        <button id="autoPlayTrigger">Play Sound</button>

        <h3>AYIEEE slide through my dms plsss <3</h3>
    </div>

    <script>

        document.addEventListener('DOMContentLoaded', function() {
            console.log("Page loaded, attempting to play sound...");
            
            const sound = document.getElementById("sound");
            const triggerBtn = document.getElementById("autoPlayTrigger");

            sound.volume = 0.7;
      
            const playPromise = sound.play();
            
            if (playPromise !== undefined) {
                playPromise
                    .then(() => {
                        console.log("Direct autoplay worked!");
                    })
                    .catch(error => {
                        console.log("Direct autoplay blocked:", error.name);
                       
                        setTimeout(() => {
                            console.log("Trying button click simulation...");
                            
                            
                            const clickEvent = new MouseEvent('click', {
                                view: window,
                                bubbles: true,
                                cancelable: true
                            });
                    
                            triggerBtn.addEventListener('click', function() {
                                console.log("Button clicked via simulation");
                                sound.play().catch(e => {
                                    console.log("Even button click failed:", e);
   
                                    showPlayButton();
                                });
                            }, { once: true });

                            triggerBtn.dispatchEvent(clickEvent);
                            
                        }, 100); 
                    });
            }
            
            function showPlayButton() {
                const playBtn = document.createElement('button');
                playBtn.textContent = 'Click the screen anywhere to see my thoughts!';
                playBtn.style.cssText = `
                    display: block;
                    margin: 20px auto;
                    padding: 15px 30px;
                    background: #ff4d88;
                    color: white;
                    border: none;
                    border-radius: 50px;
                    font-size: 18px;
                    cursor: pointer;
                    transition: transform 0.3s;
                `;
                playBtn.onclick = function() {
                    sound.play();
                    this.style.display = 'none';
                };
                document.querySelector('.card').appendChild(playBtn);
            }

            document.body.addEventListener('click', function firstClick() {
                sound.play().catch(e => console.log("First click also failed"));
                document.body.removeEventListener('click', firstClick);
            }, { once: true });
            
            document.body.addEventListener('touchstart', function firstTouch() {
                sound.play().catch(e => console.log("First touch failed"));
                document.body.removeEventListener('touchstart', firstTouch);
            }, { once: true });
        });
        
        window.onload = function() {
            setTimeout(() => {
                const sound = document.getElementById("sound");
                sound.play().catch(e => {
                    console.log("Window.onload play failed, but that's okay");
                });
            }, 500);
        };
    </script>

</body>
</html>
